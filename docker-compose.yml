services:
  keel:
    build: .
    init: true   # tini — proper PID 1 / signal handling for forked workers
    volumes:
      - ./dev/node.hcl:/etc/keel/node.hcl:ro
      - ./dev/config:/etc/keel/config:ro
    ports:
      - "8080:80"     # proxy — curl http://localhost:8080
      - "10790:10790" # metrics — curl http://localhost:10790/metrics
    depends_on:
      - backend1
      - backend2
      - backend3

  # traefik/whoami returns hostname + request info — easy to see which backend responded.
  # Fixed IPs: Keel takes backend addresses as ip:port.
  backend1:
    image: traefik/whoami
    networks: { default: { ipv4_address: 172.29.100.11 } }

  backend2:
    image: traefik/whoami
    networks: { default: { ipv4_address: 172.29.100.12 } }

  backend3:
    image: traefik/whoami
    networks: { default: { ipv4_address: 172.29.100.13 } }

  # A little traffic for the dashboards: plain requests and slower ones
  # (whoami's ?wait= delays its answer).
  traffic:
    image: curlimages/curl:8.15.0
    entrypoint: ["sh", "-c"]
    command:
      - |
        while true; do
          curl -s -o /dev/null http://keel/
          curl -s -o /dev/null "http://keel/?wait=$$((RANDOM % 300))ms"
          sleep 0.2
        done
    depends_on:
      - keel

  # Prometheus with the alerting rules in contrib/prometheus:
  # http://localhost:9090/alerts
  prometheus:
    image: prom/prometheus:v3.5.0
    volumes:
      - ./dev/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./contrib/prometheus:/etc/prometheus/rules:ro
    ports:
      - "9090:9090"

  # Grafana with the dashboards in contrib/grafana: http://localhost:3000
  # (anonymous admin — local dev only).
  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./dev/grafana:/etc/grafana/provisioning:ro
      - ./contrib/grafana:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

networks:
  default:
    ipam:
      config:
        # Other services take addresses from ip_range, clear of the backends.
        - subnet: 172.29.100.0/24
          ip_range: 172.29.100.128/25
