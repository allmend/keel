services:
  keel:
    build: .
    init: true   # tini — proper PID 1 / signal handling for forked workers
    volumes:
      - ./dev/node.yaml:/etc/keel/node.yaml:ro
      - ./dev/config:/etc/keel/config:ro
    ports:
      - "8080:80"     # proxy — curl http://localhost:8080
      - "10790:10790" # metrics — curl http://localhost:10790/metrics
    depends_on:
      - backend1
      - backend2
      - backend3

  # traefik/whoami returns hostname + request info — easy to see which backend responded
  backend1:
    image: traefik/whoami

  backend2:
    image: traefik/whoami

  backend3:
    image: traefik/whoami
