# cargo deny check: advisories, licenses, duplicate versions.

[graph]
all-features = true

[advisories]
# Vulnerabilities and unsound crates fail; unmaintained ones fail when the
# crate is a direct dependency.
unmaintained = "workspace"
unsound = "all"
yanked = "deny"

[licenses]
# Compatible with Keel's Apache-2.0.
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "MIT-0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CC0-1.0",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
